<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title"><title id="title">Sales conversation practice loop</title><style>:root{--i:#183b56;--l:#607080;--b:#dfeaf3;--g:#e8f5ed;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--b:#23364a;--g:#183b2a;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.l{stroke:var(--l);stroke-width:3}.t{font-size:17px;font-weight:700}.s{font-size:13px}</style><g><rect class="x" x="20" y="60" width="145" height="75" fill="var(--b)"/><rect class="x" x="195" y="60" width="145" height="75" fill="var(--n)"/><rect class="x" x="370" y="60" width="145" height="75" fill="var(--b)"/><rect class="x" x="545" y="60" width="145" height="75" fill="var(--n)"/><rect class="x" x="720" y="60" width="145" height="75" fill="var(--g)"/></g><path class="l" fill="none" d="M165 98H195M340 98H370M515 98H545M690 98H720"/><text class="t" x="92" y="92" text-anchor="middle">Role card</text><text class="t" x="267" y="92" text-anchor="middle">Practice round</text><text class="t" x="442" y="82" text-anchor="middle">Buyer</text><text class="t" x="442" y="103" text-anchor="middle">feedback</text><text class="t" x="617" y="82" text-anchor="middle">Coaching</text><text class="t" x="617" y="103" text-anchor="middle">review</text><text class="t" x="792" y="82" text-anchor="middle">Learning</text><text class="t" x="792" y="103" text-anchor="middle">record</text></svg>
